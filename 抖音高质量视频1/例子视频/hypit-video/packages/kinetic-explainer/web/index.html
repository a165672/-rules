<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>为什么你什么都不干，却还是很累</title>
  <style>
@font-face { font-family: 'NSerif'; src: url('../../../assets/fonts/NotoSerifSC-Black.otf') format('opentype'); font-weight: 900; }
@font-face { font-family: 'NSerif'; src: url('../../../assets/fonts/NotoSerifSC-Bold.otf') format('opentype'); font-weight: 700; }
@font-face { font-family: 'NSans'; src: url('../../../assets/fonts/NotoSansSC-Regular.otf') format('opentype'); font-weight: 400; }
@font-face { font-family: 'NSans'; src: url('../../../assets/fonts/NotoSansSC-Medium.otf') format('opentype'); font-weight: 500; }
@font-face { font-family: 'NSans'; src: url('../../../assets/fonts/NotoSansSC-Bold.otf') format('opentype'); font-weight: 700; }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage"></div>
  <script src="engine.js"></script>
  <!-- 每个章节一个文件；顺序无关，引擎按时间调度 -->
  <script src="scenes/intro.js"></script>
  <script src="scenes/ch01.js"></script>
  <script src="scenes/ch02.js"></script>
  <script src="scenes/ch03.js"></script>
  <script src="scenes/ch04.js"></script>
  <script src="scenes/ch05.js"></script>
  <script>
    // 浏览器直接打开时：?t=12.3 定格到某一时刻；?play 实时预览
    V.ready.then(() => {
      const q = new URLSearchParams(location.search);
      if (q.has('t')) V.renderAt(parseFloat(q.get('t')));
      if (q.has('play')) {
        const t0 = performance.now() - (parseFloat(q.get('play')) || 0) * 1000;
        const loop = () => { V.renderAt(((performance.now() - t0) / 1000) % V.DURATION); requestAnimationFrame(loop); };
        loop();
      }
    });
  </script>
</body>
</html>
